# This laptop has 8 GB and measured 1.2 GB free while the app build ran. With a 1536m
# Gradle heap the JVM died with a native malloc failure, so the heap is halved and the
# build runs one worker at a time.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
android.useAndroidX=false
android.nonTransitiveRClass=true
