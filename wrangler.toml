name = "rdu-gowild-board"
main = "src/index.js"
compatibility_date = "2026-11-01"

# No preview URLs: this is a one-user tool whose only address is the token path.
# A second, unlisted alias for the same content is surface with no benefit.
preview_urls = false

# The board state is written by the headless-browser collector (see collector/).
# Create the namespace with:  npx wrangler kv namespace create BOARD
# then paste the returned id here.
[[kv_namespaces]]
binding = "BOARD"
id = "fec311a9eda84b90a8490061cda5d4bf"

# The one origin served WITHOUT a token, at /<profile>, so a link can be sent to
# someone who does not have BOARD_TOKEN. It reads only its own KV key
# (state:lga) and cannot see or overwrite the token-gated RDU board.
[vars]
PUBLIC_PROFILE = "lga"

# BOARD_TOKEN is NOT set here. It is a secret:
#   npx wrangler secret put BOARD_TOKEN      (production)
#   BOARD_TOKEN=... in .dev.vars             (local)
