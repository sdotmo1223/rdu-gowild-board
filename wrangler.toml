name = "rdu-gowild-board"
main = "src/index.js"
compatibility_date = "2026-11-01"

# No preview URLs: this is a one-user tool whose only address is the token path.
# A second, unlisted alias for the same content is surface with no benefit.
preview_urls = false

# The board state is written by the headless-browser collector (see collector/).
# Create the namespace with:  npx wrangler kv namespace create BOARD
# then paste the returned id here.
[[kv_namespaces]]
binding = "BOARD"
id = "fec311a9eda84b90a8490061cda5d4bf"

# The origins served WITHOUT a token, at /<profile>. RDU only, decided 2026-11-11:
# three airports could not be kept fresh on the cadence GitHub actually delivers, so
# /lga and /phl are switched off until RDU is mastered. Their snapshots stay in KV and
# their route lists stay in the code; re-enabling either is one word in this list.
# Each public page reads only its own KV key, so no origin can see another's.
[vars]
PUBLIC_PROFILE = "rdu"
# The public origin every push opens with one tap. No token: notifications land on
# /rdu?focus=<event key>, and the key grammar is the outbox entry key verbatim.
BOARD_URL = "https://rdu-gowild-board.sdotmo1223.workers.dev"

# BOARD_TOKEN is NOT set here. It is a secret:
#   npx wrangler secret put BOARD_TOKEN      (production)
#   BOARD_TOKEN=... in .dev.vars             (local)
#
# GH_DISPATCH_TOKEN is also a secret: a fine-grained PAT with Actions: write on this
# repo. The Cron Trigger uses it to nudge the collector when the board is stale (see
# src/dispatch.mjs). Unset is a supported state -- the receiver logs why it did
# nothing and the sweep keeps running on GitHub's own schedule.
#   npx wrangler secret put GH_DISPATCH_TOKEN

# Every 15 minutes the Worker reads its own board age and dispatches the collector only
# when the board is stale, with a 10-minute cooldown on top. GitHub drops schedule
# events (measured 2026-11-11: three consecutive recovery slots produced no run at all),
# and a dropped event cannot be recovered from inside a run that never started.
[triggers]
crons = ["*/15 * * * *"]
