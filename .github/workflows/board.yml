name: board-collect

# DataDome fingerprints clients, so a Worker cannot fetch Frontier directly.
# A real Chromium solves the challenge the same way a person does, and this is
# the only process that ever talks to Frontier.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Hard guarantee of the "exactly one agent touches Frontier" rule: a second run
# can never start while one is in flight.
concurrency:
  group: gowild-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect RDU GoWild board
        run: node collector/collect.mjs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
