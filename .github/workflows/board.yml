name: board-collect

# DataDome fingerprints clients, so a Worker cannot fetch Frontier directly.
# A real Chromium solves the challenge the same way a person does, and this is
# the only process that ever talks to Frontier.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Hard guarantee of the "exactly one agent touches Frontier" rule: a second run
# can never start while one is in flight.
concurrency:
  group: gowild-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Without these the collector still sweeps Frontier, then discovers it has
      # nowhere to write and exits 0 — a green run that did nothing, every 15
      # minutes, forever. Fail in five seconds instead of two minutes.
      - name: Refuse to sweep without somewhere to write
        env:
          KV_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$KV_ID" ]; then missing="$missing CF_KV_NAMESPACE_ID"; fi
          if [ -z "$API_TOKEN" ]; then missing="$missing CF_API_TOKEN"; fi
          if [ -z "$ACCOUNT_ID" ]; then missing="$missing CF_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — refusing to sweep Frontier for nothing."
            echo "Set them in Settings > Secrets and variables > Actions, then re-enable this workflow."
            exit 1
          fi
          echo "credentials present: sweeping"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect RDU GoWild board
        run: node collector/collect.mjs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          # Optional phone push. An alert nobody has seen fire is not an alert.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
