name: board-collect

# DataDome fingerprints clients, so a Worker cannot fetch Frontier directly.
# A real Chromium solves the challenge the same way a person does, and this is
# the only process that ever talks to Frontier.
#
# CADENCE, measured 2026-11-03: one run is ~2m05s of wall clock, billed as 3
# minutes. GitHub Free meters 2,000 Actions minutes per month on a PRIVATE repo,
# so */15 (96 runs/day => ~288 billed min/day) would exhaust that in about a
# week and then stop. Standard runners are unmetered on a PUBLIC repo, which is
# why this one is public; if it is ever made private again, drop to
# '0 */2 * * *' (~1,080 min/month) in the same change.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Hard guarantee of the "exactly one agent touches Frontier" rule: a second run
# can never start while one is in flight.
concurrency:
  group: gowild-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A run that sweeps Frontier and only then discovers it cannot write is the
      # worst case: 28 fare requests spent for nothing, every cadence, forever.
      # This proves the write path with one cheap request and zero Frontier
      # contact. Prefers the Worker ingest endpoint (no Cloudflare token needed);
      # falls back to the Cloudflare KV API if that is what is configured.
      - name: Prove the write path before touching Frontier
        env:
          INGEST_URL: ${{ vars.BOARD_INGEST_URL }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          set -u
          if [ -n "${INGEST_URL:-}" ] && [ -n "${BOARD_TOKEN:-}" ]; then
            code=$(curl -sS -o /tmp/preflight.json -w '%{http_code}' \
              -X POST "${INGEST_URL}?dryRun=1" \
              -H "Authorization: Bearer ${BOARD_TOKEN}" \
              -H 'Content-Type: application/json' -d '{}' || echo 000)
            label="worker ingest"
          elif [ -n "${API_TOKEN:-}" ] && [ -n "${ACCOUNT_ID:-}" ] && [ -n "${KV_ID:-}" ]; then
            code=$(curl -sS -o /tmp/preflight.json -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/storage/kv/namespaces/${KV_ID}/keys" \
              -H "Authorization: Bearer ${API_TOKEN}" || echo 000)
            label="cloudflare kv"
          else
            echo "::error::No write path configured. Set BOARD_TOKEN + the BOARD_INGEST_URL variable, or all three CF_* secrets. Refusing to sweep Frontier for nothing."
            exit 1
          fi

          if [ "$code" != "200" ]; then
            echo "::error::Write path ($label) rejected the credentials: HTTP $code. No Frontier request has been made."
            head -c 500 /tmp/preflight.json || true
            exit 1
          fi
          echo "write path verified ($label, HTTP 200): sweeping"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect RDU GoWild board
        run: node collector/collect.mjs
        env:
          # Preferred: the Worker owns the KV write, so no Cloudflare token is
          # held by the runner at all.
          BOARD_INGEST_URL: ${{ vars.BOARD_INGEST_URL }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          # Legacy direct-KV path, used only when the ingest pair is absent.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          # Optional phone push. An alert nobody has seen fire is not an alert.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
