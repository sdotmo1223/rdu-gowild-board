name: gowild-lga

# A second origin, not a second crawler: same collector, same Worker, same
# BOARD_TOKEN. Only BOARD_PROFILE changes, which swaps the route list and sends
# the snapshot to the KV key `state:lga`.
#
# The concurrency group is deliberately the SAME string as board.yml. GitHub then
# serialises the two, so "exactly one process touches Frontier at a time" survives
# having two schedules. Offset by four minutes so they queue rather than wait.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

concurrency:
  group: gowild-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Never spend fare requests before proving the write path, exactly as the
      # RDU workflow does. dryRun writes nothing and costs no Frontier request.
      - name: Prove the write path before touching Frontier
        env:
          INGEST_URL: ${{ vars.BOARD_INGEST_URL }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          set -u
          if [ -z "${INGEST_URL:-}" ] || [ -z "${BOARD_TOKEN:-}" ]; then
            echo "::error::BOARD_INGEST_URL variable or BOARD_TOKEN secret is missing. Refusing to sweep Frontier for nothing."
            exit 1
          fi
          code=$(curl -sS -o /tmp/preflight.json -w '%{http_code}' \
            -X POST "${INGEST_URL}?dryRun=1" \
            -H "Authorization: Bearer ${BOARD_TOKEN}" \
            -H 'Content-Type: application/json' -d '{}' || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::Write path rejected the credentials: HTTP $code. No Frontier request has been made."
            head -c 500 /tmp/preflight.json || true
            exit 1
          fi
          echo "write path verified (HTTP 200): sweeping LGA"

      - name: Install dependencies
        run: npm ci

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect LGA GoWild board
        run: node collector/collect.mjs
        env:
          BOARD_PROFILE: lga
          BOARD_INGEST_URL: ${{ vars.BOARD_INGEST_URL }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
