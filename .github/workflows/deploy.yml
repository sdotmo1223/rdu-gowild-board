name: gowild-deploy

# The collector and the Worker were two halves that could drift: CI wrote fresh
# snapshots every tick, while the code that renders them only went live when
# somebody ran wrangler deploy by hand. A merged fix could sit unshipped for days
# while the board kept serving the old logic. This closes that gap and, because it
# runs the gates first, it cannot deploy a red tree either.
#
# No new secret: CF_API_TOKEN and CF_ACCOUNT_ID already exist for the collector.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'collector/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: gowild-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts: the suites are pure Node and never launch a browser, so
      # downloading Chromium here would add a minute to every deploy for nothing.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gates (a red tree must not deploy)
        run: |
          set -e
          npm run lint
          npm run dry
          npm test
          npm run stress

      # The token is read here and nowhere else. Putting it at job level exposed it
      # to the checkout and to the test suites, which have no business seeing it.
      # CF_API_TOKEN is KV-scoped and Cloudflare refuses it for a Worker upload
      # ("No access to the specified service"), so deploying needs its own token.
      - name: Is a deploy token available?
        id: token
        run: echo "have=${{ secrets.CF_DEPLOY_TOKEN != '' }}" >> $GITHUB_OUTPUT

      # A green run that shipped nothing is worse than a red one: it is a false
      # claim that the fix is live. This fails instead, so a green badge means the
      # Worker on the edge is this commit. The one way to silence it is to give the
      # repo a deploy token.
      - name: Fail if this push cannot ship
        if: steps.token.outputs.have != 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::CF_DEPLOY_TOKEN is missing, so this push did NOT reach Cloudflare."
          echo "CF_API_TOKEN is KV-scoped and Cloudflare refuses it for a Worker upload."
          echo "Create a token with Account > Workers Scripts > Edit, then run:"
          echo "  gh secret set CF_DEPLOY_TOKEN --repo ${{ github.repository }}"
          echo "Until then, every change under src/ is invisible to the live board."
          exit 1

      - name: Deploy to Cloudflare
        # main only: a manual dispatch from a feature branch must not push
        # unreviewed code to production.
        if: steps.token.outputs.have == 'true' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      # The upload can succeed while the edge keeps serving the previous script, and
      # a skipped step used to look exactly like a shipped one. Ask the account what
      # it actually has, and fail if no deployment is dated today.
      - name: Prove the edge took it
        if: steps.token.outputs.have == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -u
          out=$(npx --yes wrangler@4 deployments list --name rdu-gowild-board 2>&1 || true)
          echo "$out" | head -c 800; echo
          if ! echo "$out" | grep -q "$(date -u +%Y-%m-%d)"; then
            echo "::error::No deployment dated today (UTC): the upload did not land."
            exit 1
          fi
          echo "edge reports a deployment created today"

      - name: Note why a non-main ref did not deploy
        if: github.ref != 'refs/heads/main'
        run: echo "::notice::Not main; gates ran, nothing deployed."
