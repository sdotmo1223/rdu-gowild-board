name: gowild-deploy

# The collector and the Worker were two halves that could drift: CI wrote fresh
# snapshots every tick, while the code that renders them only went live when
# somebody ran wrangler deploy by hand. A merged fix could sit unshipped for days
# while the board kept serving the old logic. This closes that gap and, because it
# runs the gates first, it cannot deploy a red tree either.
#
# No new secret: CF_API_TOKEN and CF_ACCOUNT_ID already exist for the collector.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'collector/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: gowild-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts: the suites are pure Node and never launch a browser, so
      # downloading Chromium here would add a minute to every deploy for nothing.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gates (a red tree must not deploy)
        run: |
          set -e
          npm run lint
          npm run dry
          npm test
          npm run stress

      # The token is read here and nowhere else. Putting it at job level exposed it
      # to the checkout and to the test suites, which have no business seeing it.
      # CF_API_TOKEN is KV-scoped and Cloudflare refuses it for a Worker upload
      # ("No access to the specified service"), so deploying needs its own token.
      - name: Is a deploy token available?
        id: token
        run: echo "have=${{ secrets.CF_DEPLOY_TOKEN != '' }}" >> $GITHUB_OUTPUT

      # A green run that shipped nothing is worse than a red one: it is a false
      # claim that the fix is live. This fails instead, so a green badge means the
      # Worker on the edge is this commit. The one way to silence it is to give the
      # repo a deploy token.
      - name: Fail if this push cannot ship
        if: steps.token.outputs.have != 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::CF_DEPLOY_TOKEN is missing, so this push did NOT reach Cloudflare."
          echo "CF_API_TOKEN is KV-scoped and Cloudflare refuses it for a Worker upload."
          echo "Create a token with Account > Workers Scripts > Edit, then run:"
          echo "  gh secret set CF_DEPLOY_TOKEN --repo ${{ github.repository }}"
          echo "Until then, every change under src/ is invisible to the live board."
          exit 1

      # "No access to the specified service" is Cloudflare's answer for a token with
      # the wrong scope, a token in the wrong account, and a script that does not
      # exist alike. Ask the API first so the run names which one it is, and print
      # the token's own permission list (never the token).
      - name: Check the deploy token can see this Worker
        if: steps.token.outputs.have == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -u
          base="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          # An invalid value, a token scoped to another account and a token without
          # Workers Scripts:Edit all end in the same 403. Three cheap questions
          # separate them, and none of them prints the token.
          echo "::group::is the stored value a live token?"
          vcode=$(curl -sS -o /tmp/verify.json -w '%{http_code}' -H "$auth" "$base/user/tokens/verify" || echo 000)
          echo "verify HTTP $vcode"; head -c 300 /tmp/verify.json || true; echo
          if [ "$vcode" != "200" ]; then
            echo "::error::CF_DEPLOY_TOKEN is not a valid Cloudflare API token (HTTP $vcode): wrong, truncated or revoked value. Create a new token and re-set the secret."
            exit 1
          fi
          # The token id is public metadata and identifies the exact row to edit in
          # the dashboard, which is otherwise guesswork among similarly named tokens.
          echo "token id: $(grep -oE '"id":"[a-f0-9]+"' /tmp/verify.json | head -1 | sed 's/.*":"//;s/"$//')"
          echo "::endgroup::"

          echo "::group::which accounts can it see?"
          acode=$(curl -sS -o /tmp/acct.json -w '%{http_code}' -H "$auth" "$base/accounts" || echo 000)
          echo "accounts HTTP $acode"; head -c 400 /tmp/acct.json || true; echo
          echo "wanted account: ${CF_ACCOUNT_ID}"
          # Zero accounts is a different mistake from the wrong account, and the two
          # need different fixes: an empty grant list means the Account resources
          # dropdown was left empty when the token was made.
          if grep -qE '"result"[[:space:]]*:[[:space:]]*\[\]' /tmp/acct.json; then
            echo "::error::This token has NO account permissions at all (/accounts returned an empty list), so it can reach no Worker in any account."
            echo "Fix: edit the token -> Account resources -> Include -> the account, and Permissions -> Account -> Workers Scripts -> Edit."
            exit 1
          fi
          if ! grep -qE "\"id\"[[:space:]]*:[[:space:]]*\"${CF_ACCOUNT_ID}\"" /tmp/acct.json; then
            echo "::error::Token is valid but scoped to a different account than ${CF_ACCOUNT_ID}."
            echo "Fix: recreate it with Account resources -> Include -> the account that owns rdu-gowild-board."
            exit 1
          fi
          echo "::endgroup::"

          code=$(curl -sS -o /tmp/svc.json -w '%{http_code}' -H "$auth" \
            "$base/accounts/${CF_ACCOUNT_ID}/workers/scripts/rdu-gowild-board" || echo 000)
          if [ "$code" = "200" ]; then
            echo "token can read worker rdu-gowild-board (HTTP 200)"
            exit 0
          fi
          echo "::error::Token is valid and sees the account, but not this Worker (HTTP $code)."
          head -c 400 /tmp/svc.json || true; echo
          echo "Needs: Account > Workers Scripts > Edit. If the permission is already there, delete the token and make a new one: Cloudflare keeps stale permission edges on edited tokens."
          exit 1

      - name: Deploy to Cloudflare
        # main only: a manual dispatch from a feature branch must not push
        # unreviewed code to production.
        if: steps.token.outputs.have == 'true' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # The action defaults to an old v3, which cannot read this config's
          # preview_urls and warns on every deploy. Match the local toolchain.
          wranglerVersion: '4'
          command: deploy

      # The upload can succeed while the edge keeps serving the previous script, and
      # a skipped step used to look exactly like a shipped one. Ask the account what
      # it actually has, and fail if no deployment is dated today.
      - name: Prove the edge took it
        if: steps.token.outputs.have == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -u
          out=$(npx --yes wrangler@4 deployments list --name rdu-gowild-board 2>&1 || true)
          echo "$out" | head -c 800; echo
          if ! echo "$out" | grep -q "$(date -u +%Y-%m-%d)"; then
            echo "::error::No deployment dated today (UTC): the upload did not land."
            exit 1
          fi
          echo "edge reports a deployment created today"

      # The page is the product, and no unit test loads it in a browser. This runs
      # AFTER the upload, against the live edge, so a green deploy means a page that
      # actually rendered -- not merely a script that uploaded. A failure turns the run
      # red; it does not roll back, because the previous script is still what is served
      # only until the next push, and a silent rollback would hide the failure.
      - name: Browser smoke against the live edge
        if: steps.token.outputs.have == 'true' && github.ref == 'refs/heads/main'
        env:
          SMOKE_URL: https://rdu-gowild-board.sdotmo1223.workers.dev/rdu
        run: |
          set -u
          # Reuses the playwright dependency already in package.json; the deploy job
          # installs with --ignore-scripts, so only the browser binary is missing.
          npx playwright install chromium
          node tools/smoke.mjs "${SMOKE_URL}"

      - name: Note why a non-main ref did not deploy
        if: github.ref != 'refs/heads/main'
        run: echo "::notice::Not main; gates ran, nothing deployed."
