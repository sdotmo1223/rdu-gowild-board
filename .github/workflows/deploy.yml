name: gowild-deploy

# The collector and the Worker were two halves that could drift: CI wrote fresh
# snapshots every tick, while the code that renders them only went live when
# somebody ran wrangler deploy by hand. A merged fix could sit unshipped for days
# while the board kept serving the old logic. This closes that gap and, because it
# runs the gates first, it cannot deploy a red tree either.
#
# No new secret: CF_API_TOKEN and CF_ACCOUNT_ID already exist for the collector.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'collector/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: gowild-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Secrets cannot be referenced in an `if:`, env can. CF_API_TOKEN is scoped to
    # KV and Cloudflare refuses it for a Worker upload ("No access to the specified
    # service"), so deploying needs its own token with Workers Scripts:Edit.
    env:
      DEPLOY_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts: the suites are pure Node and never launch a browser, so
      # downloading Chromium here would add a minute to every deploy for nothing.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gates (a red tree must not deploy)
        run: |
          set -e
          npm test
          npm run stress

      - name: Deploy to Cloudflare
        if: env.DEPLOY_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.DEPLOY_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      # A deploy step that always fails is worse than none: it makes every push red
      # for a credential the repo does not hold, and a red badge stops meaning
      # "broken". This says exactly what is missing instead.
      - name: Say why nothing was deployed
        if: env.DEPLOY_TOKEN == ''
        run: |
          echo "::notice::Gates passed; no CF_DEPLOY_TOKEN secret, so this run did not deploy."
          echo "CF_API_TOKEN is KV-scoped and cannot upload a Worker. Add a token with Workers Scripts:Edit as CF_DEPLOY_TOKEN to make pushes deploy themselves."
