name: gowild-sweep

# ONE job, ONE Chromium, every origin, strictly one at a time.
#
# Why this replaced three near-identical workflows:
#   - each workflow paid its own `npm ci` + Chromium install (~40-70 s) every tick;
#   - three workflows sharing one concurrency group queue behind each other, so a
#     delayed RDU run pushed LGA and PHL later and later (observed: a dispatched run
#     waited ~4 minutes behind the cron);
#   - adding an origin meant copying a file and hoping its name resolved.
#
# Now adding an origin is a profile in src/routes.js plus a word in PUBLIC_PROFILE.
#
# Request budget: each profile is capped (see SWEEP_MAX_REQUESTS below), so the
# number of Frontier requests per tick is bounded no matter how many origins exist.
# A refusal aborts that profile's sweep and the rotation defers the rest to the next
# tick, which is why a smaller burst buys more data than a bigger one.
on:
  schedule:
    # Primary: half the routes per delivery, every delivery.
    - cron: '*/15 * * * *'
    # Recovery: a second phase of the hour, for the slots GitHub drops. It sweeps only
    # when the board is already stale, so a healthy hour still costs one burst
    # (measured 2026-11-07: 9 deliveries in 24 h, gaps of 233, 362 and 434 minutes).
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Comma list of origins to sweep (the cron sweeps rdu only)'
        default: 'rdu'
      full:
        description: 'Ask every route in each profile (deliberate, not scheduled)'
        type: boolean
        default: false
      only:
        description: 'Comma list of route codes to ask (diagnostic; ignores shard and budget). Costs 2 requests per code per date.'
        default: ''

concurrency:
  group: gowild-collector
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # A recovery entry can only help if it costs nothing when the primary is
      # delivering: sweeping on top of a healthy board would double the requests
      # Frontier sees. This reads the board's own age and skips a tick nobody needs.
      # It sweeps when the age cannot be read -- a missed tick leaves the page hours
      # stale, which is the failure being removed here.
      - name: Recovery slot gate
        id: gate
        if: github.event_name == 'schedule' && github.event.schedule != '*/15 * * * *'
        env:
          INGEST_URL: ${{ vars.BOARD_INGEST_URL }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          set -u
          AGE=unknown
          if [ -n "${INGEST_URL:-}" ] && [ -n "${BOARD_TOKEN:-}" ]; then
            BASE="${INGEST_URL%/api/ingest}"
            AGE=$(curl -sS -m 20 -H "Authorization: Bearer ${BOARD_TOKEN}" "${BASE}/api/board" \
              | node tools/recovery-gate.mjs age || echo unknown)
          fi
          DECISION=$(node tools/recovery-gate.mjs decide "${{ github.event.schedule }}" "$AGE")
          echo "$DECISION"
          echo "$DECISION" | grep '^skip=' >> "$GITHUB_OUTPUT" || true

      # A sweep that spends 18 fare requests and only then discovers it cannot
      # write is the worst case there is. This costs one cheap request and zero
      # Frontier contact.
      - name: Prove the write path before touching Frontier
        if: steps.gate.outputs.skip != 'true'
        env:
          INGEST_URL: ${{ vars.BOARD_INGEST_URL }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          BOARD_WRITE_TOKEN: ${{ secrets.BOARD_WRITE_TOKEN }}
        run: |
          set -u
          # Writes use the write token when it exists; the board token is read-only.
          WT="${BOARD_WRITE_TOKEN:-${BOARD_TOKEN:-}}"
          if [ -z "${INGEST_URL:-}" ] || [ -z "${WT:-}" ]; then
            echo "::error::BOARD_INGEST_URL variable or BOARD_TOKEN secret is missing. Refusing to sweep Frontier for nothing."
            exit 1
          fi
          code=$(curl -sS -o /tmp/preflight.json -w '%{http_code}' \
            -X POST "${INGEST_URL}?dryRun=1" \
            -H "Authorization: Bearer ${WT}" \
            -H 'Content-Type: application/json' -d '{}' || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::Write path rejected the credentials: HTTP $code. No Frontier request has been made."
            head -c 500 /tmp/preflight.json || true
            exit 1
          fi
          echo "write path verified (HTTP 200)"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      # Cheap and before Chromium on purpose. A collector that cannot resolve its
      # own identifiers would otherwise spend a full budget of Frontier requests
      # and then throw before writing the snapshot -- which is what happened on
      # 2026-11-04 10:18 ("boardRows is not defined", 42 requests discarded).
      - name: Lint before spending requests
        if: steps.gate.outputs.skip != 'true'
        run: npm run lint

      # Executes the collector's main() against a fixture: same plan, parse, merge,
      # alerts and write path, zero Frontier contact. A ReferenceError in there used
      # to be discovered by the cron, after the requests had been paid for.
      - name: Dry-run the collector before spending requests
        if: steps.gate.outputs.skip != 'true'
        run: npm run dry

      - name: Cache Chromium
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The browser download is essential; the system packages are best-effort.
      # Measured 2026-11-11 (run 43058005681): `--with-deps` failed on an apt DNS blip
      # (`Temporary failure resolving 'azure.archive.ubuntu.com'`), killed the job after
      # 10m27s and cost EVERY origin its tick -- all three boards went hours stale. The
      # deps step only supplies fonts; a launch failure happens before any Frontier
      # request, so it costs nothing, while a failed install costs the whole sweep.
      - name: Install Chromium
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -u
          ok=0
          for attempt in 1 2; do
            if npx playwright install chromium; then ok=1; break; fi
            echo "::warning::Chromium download failed (attempt $attempt); retrying in 15s"
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Chromium could not be downloaded after two attempts. No Frontier request was made."
            exit 1
          fi
          if ! npx playwright install-deps chromium; then
            echo "::warning::System packages for Chromium failed to install (apt/DNS). Continuing: the browser downloaded, and a launch failure still costs zero Frontier requests."
          fi

      # Sequential by construction: the loop blocks on each sweep. Secondaries run
      # on alternating quarters of the hour so a tick carries the primary plus one
      # secondary, which keeps the total request count at roughly what it was when
      # there was a single origin.
      - name: Sweep each origin in turn
        if: steps.gate.outputs.skip != 'true'
        env:
          BOARD_INGEST_URL: ${{ vars.BOARD_INGEST_URL }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          BOARD_WRITE_TOKEN: ${{ secrets.BOARD_WRITE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FULL: ${{ inputs.full && '1' || '0' }}
          WANT: ${{ inputs.profiles }}
          ONLY: ${{ inputs.only }}
        run: |
          # set -u only: with -e, the first origin to fail would silently skip the
          # others, so one broken profile could starve the rest. Failures are
          # collected and reported at the end instead.
          #
          # ONE ORIGIN, deliberately. Decided 2026-11-11: 45 routes across three
          # airports on a ~30-request budget, swept on a clock GitHub delivers about
          # hourly, cannot honour a 3-hour row ceiling -- LGA and PHL were routinely
          # 6-9 hours old while RDU was minutes. RDU is the only scheduled sweep until
          # that board is mastered. The other profiles stay defined so a dispatch can
          # still ask a deliberate question, and re-enabling one is a word here.
          set -u
          FAILED=""
          WANT="${WANT:-rdu}"
          for P in rdu lga phl; do
            case ",$WANT," in *",$P,"*) ;; *) echo "skip $P (not requested)"; continue ;; esac
            # The cron sweeps RDU only; a manual dispatch may name any profile.
            if [ "${{ github.event_name }}" = "schedule" ] && [ "$P" != "rdu" ]; then
              echo "skip $P (single-origin cadence: RDU only)"
              continue
            fi
            case "$P" in
              rdu) BUDGET=14 ;;
              lga) BUDGET=10 ;;
              phl) BUDGET=16 ;;
              *)   BUDGET=10 ;;
            esac
            echo "::group::sweep $P (budget $BUDGET requests)"
            if BOARD_PROFILE="$P" SWEEP_ONLY="${ONLY:-}" SWEEP_MAX_REQUESTS="$BUDGET" FULL_SWEEP="$FULL" node collector/collect.mjs; then
              echo "sweep $P: ok"
            else
              echo "::error::sweep $P failed; continuing so one origin cannot starve the others"
              FAILED="$FAILED $P"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::origins that failed this tick:$FAILED"
            exit 1
          fi
